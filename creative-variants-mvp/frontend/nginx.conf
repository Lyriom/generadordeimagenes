server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 300m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /api/ {
        # El nombre `backend` se resuelve UNA vez al arrancar si se escribe
        # literal en proxy_pass, y la IP queda cacheada para siempre. Cada
        # deploy que recrea el backend le da una IP nueva y nginx sigue
        # hablando con la vieja: el sitio queda en 502 hasta reiniciarlo.
        #
        # Con el resolver interno de Docker y el nombre en una variable, nginx
        # vuelve a resolver cada 10s. El `rewrite` sustituye al sufijo `/` de
        # proxy_pass, que no se aplica cuando la URL lleva variables.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cv_backend backend;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$cv_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location /_assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, max-age=0";
    }
}
