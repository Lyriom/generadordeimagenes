services:
  backend:
    build:
      context: ./backend
      args:
        # Van fijos, no como ${VAR}: el .env es del servidor y el despliegue no
        # lo toca, así que una variable vieja de allí podía dejar la imagen sin
        # OCR ni SAM sin que se notara. Para construir sin ellos:
        #   docker compose build --build-arg INSTALL_SAM=false backend
        INSTALL_OCR: "true"
        INSTALL_SAM: "true"
    image: creative-variants-backend:latest
    container_name: cv-backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      INGEST_DIR: /app/data/ingest
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Los topes de tamaño viven aquí y no en el .env. El .env es del servidor
      # y el despliegue no lo toca a propósito (ahí están las claves), así que
      # un valor viejo se quedaba mandando y no había forma de moverlo sin
      # entrar por SSH. `environment` gana a `env_file`, así que esto manda.
      MAX_UPLOAD_MB: "4096"
      MAX_IMAGE_MEGAPIXELS: "400"
      # Lo mismo con el OCR y con SAM: van dentro de la imagen, y aquí se fija
      # que se usen. Si esto viviera solo en el .env del servidor, un valor
      # viejo de allí los dejaría apagados con todo instalado.
      ENABLE_OCR: "true"
      OCR_LANG: "es"
      SEGMENTATION_PROVIDER: "auto"
      SAM_VARIANT: "sam2"
      SAM_CHECKPOINT: /models/sam2.1_hiera_small.pt
      SAM_MODEL_TYPE: configs/sam2.1/sam2.1_hiera_s.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # El checkpoint de SAM viene dentro de la imagen (/models). Para probar
      # otro tamaño sin reconstruir: descomente y cambie SAM_CHECKPOINT.
      # - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: creative-variants-frontend:latest
    container_name: cv-frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8501/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        INSTALL_OCR: "true"
        INSTALL_SAM: "true"
    image: creative-variants-backend:latest
    container_name: cv-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    # El worker reutiliza la imagen del backend, cuyo HEALTHCHECK hace curl al
    # puerto 8000. Aquí no hay servidor HTTP: se pregunta a Celery directamente.
    healthcheck:
      # CMD-SHELL para que $HOSTNAME expanda: en forma exec no hay shell.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      INGEST_DIR: /app/data/ingest
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Los topes de tamaño viven aquí y no en el .env. El .env es del servidor
      # y el despliegue no lo toca a propósito (ahí están las claves), así que
      # un valor viejo se quedaba mandando y no había forma de moverlo sin
      # entrar por SSH. `environment` gana a `env_file`, así que esto manda.
      MAX_UPLOAD_MB: "4096"
      MAX_IMAGE_MEGAPIXELS: "400"
      # Lo mismo con el OCR y con SAM: van dentro de la imagen, y aquí se fija
      # que se usen. Si esto viviera solo en el .env del servidor, un valor
      # viejo de allí los dejaría apagados con todo instalado.
      ENABLE_OCR: "true"
      OCR_LANG: "es"
      SEGMENTATION_PROVIDER: "auto"
      SAM_VARIANT: "sam2"
      SAM_CHECKPOINT: /models/sam2.1_hiera_small.pt
      SAM_MODEL_TYPE: configs/sam2.1/sam2.1_hiera_s.yaml
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
