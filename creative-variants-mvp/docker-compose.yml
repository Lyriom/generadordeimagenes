services:
  backend:
    build:
      context: ./backend
      args:
        # OCR opcional: docker compose build --build-arg INSTALL_OCR=true backend
        INSTALL_OCR: ${INSTALL_OCR:-false}
    image: creative-variants-backend:latest
    container_name: cv-backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      INGEST_DIR: /app/data/ingest
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Descomente para habilitar SAM con checkpoints locales:
      # - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: creative-variants-frontend:latest
    container_name: cv-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    image: creative-variants-backend:latest
    container_name: cv-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      INGEST_DIR: /app/data/ingest
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
