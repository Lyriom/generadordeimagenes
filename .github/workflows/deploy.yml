name: CI/CD a Plesk (Docker)

# En cada push a main: corre la suite y, si pasa, sincroniza el código al
# servidor y reconstruye los contenedores. También se puede lanzar a mano desde
# la pestaña Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Evita despliegues solapados: un push nuevo cancela el deploy en curso.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI: construye las imágenes y corre las pruebas dentro de la misma imagen que
  # va a producción. Es el gate del deploy.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creative-variants-mvp
    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen del backend
        run: docker build -t cv-backend-ci ./backend

      - name: Correr la suite
        # Sin claves a propósito: las pruebas simulan el transporte HTTP y no
        # salen a internet. Si alguna intentara llamar a Magnific, fallaría aquí.
        run: |
          docker run --rm \
            -e CELERY_TASK_ALWAYS_EAGER=1 \
            -e MAGNIFIC_API_KEY= -e OPENAI_API_KEY= \
            cv-backend-ci \
            python -m pytest tests/ -p no:cacheprovider --tb=short

      - name: Construir la imagen de la interfaz y comprobar que carga
        # No hay backend al que llamar; solo se verifica que el módulo importa,
        # que caza errores de sintaxis antes de tumbar el sitio.
        run: |
          docker build -t cv-frontend-ci ./frontend
          docker run --rm cv-frontend-ci python -c "import api_client, app; print('la interfaz carga')"

      - name: Validar compose y Caddyfile
        # Un error de YAML aquí deja el sitio caído sin que ninguna prueba lo avise.
        env:
          CV_PASSWORD_HASH: hash-de-prueba
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e CV_PASSWORD_HASH='$2a$14$abc' \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # ---------------------------------------------------------------------------
  # CD: solo si pasan las pruebas y solo desde main. Sincroniza el repo al
  # build-context del servidor (preservando .env y data/) y reconstruye con
  # compose. El sitio lo sirve el contenedor `cv-proxy` en :8014, al que Plesk
  # hace proxy.
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Ruta del build-context en el servidor. No es secreta (es una ruta del
      # filesystem). Hardcodeada a propósito para no depender de un secret que
      # se pueda escribir mal. ← ESTA ES LA LÍNEA A AJUSTAR.
      DEPLOY_PATH: /var/www/vhosts/misiva.com.ec/httpdocs/GENERADOR
    steps:
      - uses: actions/checkout@v5

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Red de seguridad: aborta si DEPLOY_PATH no es el build-context. Evita
      # que un rsync --delete borre la carpeta equivocada si el secret o la ruta
      # estuvieran mal.
      - name: Verificar build-context
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "test -f '${{ env.DEPLOY_PATH }}/docker-compose.yml'" \
            || { echo 'ERROR: DEPLOY_PATH no contiene docker-compose.yml. Aborto para no borrar nada.'; exit 1; }

      # --delete deja la carpeta espejo del repo, así que hay dos exclusiones
      # que NO se pueden quitar:
      #   .env   la clave de Magnific y la contraseña de acceso viven solo ahí
      #   data/  los proyectos, los recortes y las artes generadas. Un deploy
      #          sin esta línea borra el trabajo del equipo.
      - name: Sincronizar código al servidor
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.github' \
            --exclude='.env' --exclude='data' \
            --exclude='__pycache__' --exclude='.pytest_cache' --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./creative-variants-mvp/ \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ env.DEPLOY_PATH }}/"

      # Reconstruye y recrea los contenedores. Se pasan los dos archivos porque
      # este proyecto tiene dos modos: en local cada servicio publica su puerto
      # y en el servidor solo lo hace el proxy del 8014.
      - name: Reconstruir y reiniciar contenedores
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd '${{ env.DEPLOY_PATH }}' && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans && docker image prune -f"

      - name: Comprobar que responde
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            'code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8014/); echo "proxy responde $code"; [ "$code" = "401" ] || { echo "Se esperaba 401 (pide contraseña). Revise CV_PASSWORD_HASH en el .env del servidor."; exit 1; }'
